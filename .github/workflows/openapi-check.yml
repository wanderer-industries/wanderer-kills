name: OpenAPI Breaking Change Check

on:
  pull_request:
    paths:
      - 'lib/**/*.ex'
      - 'priv/openapi.json'
      - 'priv/static/openapi.yaml'
      - 'config/**/*.exs'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/openapi-check.yml'
      - 'scripts/check_openapi.sh'
      - 'scripts/test_check_openapi.sh'

permissions:
  contents: read

jobs:
  check-api-changes:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    defaults:
      run:
        shell: bash

    steps:
      - name: Prepare reports
        run: |
          mkdir -p "$RUNNER_TEMP/openapi-report"
          printf 'REPORT_DIR=%s/openapi-report\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout exact PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Setup Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5'
          otp-version: '28.5'

      # Generate the base before executing PR code. Each checkout uses its own
      # lockfile, deps, and _build; never compare generated paths to static YAML.
      # Explicitly resolve both revisions: older ApiSpec.spec/0 implementations
      # leave schema modules unresolved, and resolving twice is idempotent.
      - name: Generate base OpenAPI spec
        working-directory: base
        run: |
          mix deps.get --check-locked
          mix compile
          OPENAPI_OUTPUT="$REPORT_DIR/base-spec.json" mix run --no-start -e '
            spec = WandererKillsWeb.ApiSpec.spec() |> OpenApiSpex.resolve_schema_modules()
            File.write!(System.fetch_env!("OPENAPI_OUTPUT"), Jason.encode!(spec, pretty: true))
          '
          test -s "$REPORT_DIR/base-spec.json"

      - name: Checkout current merge revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: current
          persist-credentials: false

      - name: Cache current dependencies
        uses: actions/cache@v4
        with:
          path: |
            current/deps
            current/_build
          # Keep this cache separate from the base and other workflow caches.
          # _build artifacts are BEAM-version-specific.
          key: ${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-openapi-current-${{ hashFiles('current/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-openapi-current-

      - name: Generate current OpenAPI spec
        working-directory: current
        run: |
          mix deps.get --check-locked
          mix compile
          OPENAPI_OUTPUT="$REPORT_DIR/current-spec.json" mix run --no-start -e '
            spec = WandererKillsWeb.ApiSpec.spec() |> OpenApiSpex.resolve_schema_modules()
            File.write!(System.fetch_env!("OPENAPI_OUTPUT"), Jason.encode!(spec, pretty: true))
          '
          test -s "$REPORT_DIR/current-spec.json"

      - name: Install pinned oasdiff
        working-directory: ${{ runner.temp }}
        env:
          OASDIFF_VERSION: '1.32.0'
          OASDIFF_SHA256: '5b2050787cfee2a9a3ba7b25cb50fe2c5cc45cdf5b96fbc51a4a60107f8b4aad'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            --output oasdiff.tar.gz
          printf '%s  oasdiff.tar.gz\n' "$OASDIFF_SHA256" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf oasdiff.tar.gz -C "$RUNNER_TEMP/bin" oasdiff
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/oasdiff" --version

      - name: Test comparison helper
        working-directory: ${{ runner.temp }}
        run: bash "$GITHUB_WORKSPACE/current/scripts/test_check_openapi.sh"

      - name: Compare generated specifications
        id: comparison
        # Defer the failure until the summary and artifact have been published.
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: |
          bash "$GITHUB_WORKSPACE/current/scripts/check_openapi.sh" \
            "$REPORT_DIR/base-spec.json" "$REPORT_DIR/current-spec.json" "$REPORT_DIR"

      # Summaries/artifacts work for forks and read-only tokens, without PR
      # comments or privileged events. Missing generation is an error, not an
      # empty baseline or a successful comparison.
      - name: Publish job summary
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          REPORT_DIR="$RUNNER_TEMP/openapi-report"
          mkdir -p "$REPORT_DIR"
          if [[ ! -f "$REPORT_DIR/summary.md" ]]; then
            {
              printf '# OpenAPI specification comparison\n\nStatus: ERROR\n\n'
              printf 'Setup, generation, or comparison did not complete; see the failed step logs.\n\n'
              printf 'Threshold: ERR. WARN-only changes are reported but do not block.\n'
            } > "$REPORT_DIR/summary.md"
          fi
          printf '\nBase SHA: %s\n\nCurrent merge SHA: %s\n' "$BASE_SHA" "$CURRENT_SHA" \
            >> "$REPORT_DIR/summary.md"
          cat "$REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OpenAPI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-comparison
          path: ${{ runner.temp }}/openapi-report/
          if-no-files-found: error

      - name: Enforce comparison result
        if: always() && steps.comparison.outcome != 'success'
        run: |
          printf 'OpenAPI comparison did not pass. Review the job summary and artifact.\n' >&2
          exit 1
